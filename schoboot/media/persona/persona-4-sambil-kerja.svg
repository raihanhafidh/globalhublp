<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Ilustrasi: pekerja muda di meja kantor dengan laptop dan kartu ID, sambil menyusun rencana S2 di sela jam kerja"><style>
.bob{animation:bob 3.2s ease-in-out infinite}
.bob2{animation:bob 3.2s ease-in-out -1.1s infinite}
.bob3{animation:bob 3.2s ease-in-out -2.2s infinite}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 2.4s ease-in-out -1.2s infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.chk path{stroke-dasharray:20;animation:chk 6s ease infinite}.chk.c2 path{animation-delay:.6s}@keyframes chk{0%{stroke-dashoffset:20}12%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}.bar{transform-box:fill-box;transform-origin:left;animation:bar 6s ease infinite}@keyframes bar{0%{transform:scaleX(.15)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(.15)}}.steam{animation:steam 2.8s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(4px)}50%{opacity:.6}100%{opacity:0;transform:translateY(-8px)}}.pen{animation:pen .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes pen{to{transform:rotate(-8deg) translateX(3px)}}.hand{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes spin{to{transform:rotate(360deg)}}.badge{animation:sway 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}@keyframes sway{50%{transform:rotate(5deg)}}</style><defs><linearGradient id="wall4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDF1E8"/><stop offset="1" stop-color="#EEF8F3"/></linearGradient><linearGradient id="win4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FA8EE"/><stop offset="1" stop-color="#BFDDFB"/></linearGradient><radialGradient id="lamp4" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFD24D" stop-opacity=".55"/><stop offset="1" stop-color="#FFD24D" stop-opacity="0"/></radialGradient></defs><clipPath id="frame"><rect width="480" height="300"/></clipPath><g clip-path="url(#frame)"><rect width="480" height="300" fill="url(#wall4)"/><rect x="384" y="22" width="76" height="92" rx="12" fill="url(#win4)"/><circle cx="436" cy="50" r="10" fill="#FFF3D6"/><path d="M384,90 C404,80 430,86 460,76 L460,114 L384,114 Z" fill="#7FC36B" opacity=".7"/><rect x="384" y="22" width="76" height="92" rx="12" fill="none" stroke="#fff" stroke-width="6"/><path d="M422,22 V114" stroke="#fff" stroke-width="4"/><g transform="translate(402,40) scale(0.